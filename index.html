<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:25px;
}

.container{
width:100%;
max-width:420px;
text-align:center;
}

.logo-box{
display:flex;
justify-content:center;
margin-bottom:35px;
}

.logo-circle{

width:290px;
height:290px;
border-radius:50%;
padding:8px;
background:#fff;
border:6px solid red;

box-shadow:
0 0 20px red,
0 0 45px rgba(255,0,0,.7),
0 0 80px rgba(255,0,0,.35);

animation:glow 1.4s infinite alternate;

}

.logo-circle img{

width:100%;
height:100%;
border-radius:50%;
object-fit:cover;

}

@keyframes glow{

from{

box-shadow:
0 0 18px red,
0 0 40px rgba(255,0,0,.6);

}

to{

box-shadow:
0 0 35px red,
0 0 70px rgba(255,0,0,.95);

}

}

.caption{

font-size:19px;
font-weight:600;
line-height:1.6;
margin-bottom:22px;
color:#111;

}

.title{

font-size:46px;
font-weight:800;
color:#000;
margin-bottom:35px;

}

.btn{

display:block;
text-decoration:none;
background:#ff1b1b;
color:#fff;
padding:20px;
font-size:22px;
font-weight:700;
border-radius:16px;

box-shadow:
0 12px 30px rgba(0,0,0,.25);

transition:.3s;

}

.btn:hover{

transform:translateY(-3px);

}

.telegram{

margin-right:10px;
font-size:26px;

}

@media(max-width:450px){

.logo-circle{

width:250px;
height:250px;

}

.title{

font-size:38px;

}

.caption{

font-size:18px;

}

.btn{

font-size:20px;
padding:18px;

}

}
